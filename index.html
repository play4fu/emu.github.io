<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Денди онлайн</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.2.0/jsnes.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            padding: 20px;
        }
        
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            max-width: 1200px;
            width: 100%;
        }
        
        .game-area {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            flex: 1;
            min-width: 300px;
        }
        
        #nes-container {
            width: 100%;
            max-width: 512px;
            height: auto;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
            margin: 0 auto 15px;
            position: relative;
        }
        
        #nes-container canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            display: block;
        }

        #nes-container .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 16px;
            text-align: center;
        }
        
        #nes-container .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4ade80;
            font-size: 14px;
            text-align: center;
        }
        
        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .game-controls button {
            padding: 10px 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .game-controls button:hover {
            transform: scale(1.05);
            background: #c73a54;
        }
        
        .game-controls button:active {
            transform: scale(0.95);
        }
        
        .game-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .sidebar {
            background: #16213e;
            border-radius: 15px;
            padding: 25px;
            min-width: 250px;
            max-width: 350px;
            flex: 0 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
        }
        
        .sidebar h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #e94560;
        }
        
        #qrcode {
            display: inline-block;
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        #qrcode img {
            display: block;
        }
        
        .url-text {
            font-size: 12px;
            color: #888;
            word-break: break-all;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .players-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 14px;
        }
        
        .players-info span {
            color: #4ade80;
            font-weight: bold;
        }
        
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
        
        .status .connected {
            color: #4ade80;
        }
        
        .status .disconnected {
            color: #ef4444;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            
            .sidebar {
                max-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-area">
            <div id="nes-container">
                <div class="placeholder">🎮 Загрузка игры...</div>
            </div>
            <div class="game-controls">
                <div class="file-input-wrapper">
                    <button id="loadGameBtn">🎮 Загрузить другую игру</button>
                    <input type="file" id="romFileInput" accept=".nes">
                </div>
                <button id="resetGame" disabled>🔄 Сброс</button>
                <button id="pauseGame" disabled>⏸️ Пауза</button>
            </div>
        </div>
        
        <div class="sidebar">
            <h2>📱 Управление с телефона</h2>
            <p style="font-size: 13px; color: #888; margin-bottom: 15px;">
                Отсканируйте QR-код телефоном
            </p>
            
            <div id="qrcode"></div>
            
            <div class="url-text" id="urlDisplay">Загрузка...</div>
            
            <div class="players-info">
                👥 Игроков: <span id="playerCount">0</span>
            </div>
            
            <div class="status" id="statusDisplay">
                🔌 Статус: <span class="disconnected">Отключено</span>
            </div>
        </div>
    </div>

    <script>
        // ====================
        // 1. ЭМУЛЯТОР
        // ====================
        const container = document.getElementById('nes-container');
        const placeholder = container.querySelector('.placeholder');
        
        // Создаем canvas
        const nesCanvas = document.createElement('canvas');
        nesCanvas.width = 256;
        nesCanvas.height = 240;
        nesCanvas.style.width = '100%';
        nesCanvas.style.height = '100%';
        container.appendChild(nesCanvas);
        
        // Убираем плейсхолдер, показываем загрузку
        if (placeholder) {
            placeholder.textContent = '⏳ Загрузка игры...';
        }
        
        // Создаем эмулятор
        let nes = null;
        let isRunning = false;
        let frameInterval = null;
        let romData = null;

        // Инициализация эмулятора
        function initNES() {
            try {
                nes = new jsnes.NES({
                    onFrame: function(buffer) {
                        if (!nesCanvas) return;
                        const ctx = nesCanvas.getContext('2d');
                        const imageData = ctx.createImageData(256, 240);
                        
                        for (let i = 0; i < buffer.length; i++) {
                            const pixel = buffer[i];
                            const idx = i * 4;
                            imageData.data[idx] = (pixel >> 16) & 0xFF;
                            imageData.data[idx + 1] = (pixel >> 8) & 0xFF;
                            imageData.data[idx + 2] = pixel & 0xFF;
                            imageData.data[idx + 3] = 0xFF;
                        }
                        
                        ctx.putImageData(imageData, 0, 0);
                    },
                    onAudioSample: function(left, right) {
                        // Аудио опционально
                    }
                });
                return true;
            } catch (e) {
                console.error('Ошибка инициализации эмулятора:', e);
                return false;
            }
        }

        // Загрузка ROM из URL
        function loadROMFromURL(url) {
            if (placeholder) {
                placeholder.textContent = '⏳ Загрузка игры...';
                placeholder.style.display = 'block';
            }
            
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ошибка: ${response.status}`);
                    }
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    const data = new Uint8Array(arrayBuffer);
                    if (data.length === 0) {
                        throw new Error('Файл пустой');
                    }
                    
                    if (!nes) {
                        if (!initNES()) {
                            throw new Error('Ошибка инициализации эмулятора');
                        }
                    }
                    
                    romData = data;
                    nes.loadRom(data);
                    
                    // Активируем кнопки
                    document.getElementById('resetGame').disabled = false;
                    document.getElementById('pauseGame').disabled = false;
                    
                    // Запускаем эмуляцию
                    if (!isRunning) {
                        isRunning = true;
                        runFrame();
                    }
                    
                    if (placeholder) {
                        placeholder.style.display = 'none';
                    }
                    
                    console.log('✅ Игра загружена:', url);
                })
                .catch(error => {
                    console.error('Ошибка загрузки игры:', error);
                    if (placeholder) {
                        placeholder.textContent = '❌ Ошибка загрузки игры';
                        placeholder.style.display = 'block';
                    }
                    alert('❌ Не удалось загрузить игру: ' + error.message);
                });
        }

        // Загрузка ROM из файла (пользовательский выбор)
        function loadROM(data) {
            try {
                if (!nes) {
                    if (!initNES()) {
                        alert('❌ Ошибка инициализации эмулятора');
                        return false;
                    }
                }

                romData = data;
                nes.loadRom(data);
                
                document.getElementById('resetGame').disabled = false;
                document.getElementById('pauseGame').disabled = false;
                
                if (!isRunning) {
                    isRunning = true;
                    runFrame();
                }
                
                if (placeholder) {
                    placeholder.style.display = 'none';
                }
                
                return true;
            } catch (e) {
                console.error('Ошибка загрузки ROM:', e);
                alert('❌ Ошибка загрузки игры: ' + e.message);
                return false;
            }
        }

        function runFrame() {
            if (!isRunning || !nes) return;
            
            try {
                nes.frame();
            } catch (e) {
                console.error('Ошибка в кадре:', e);
                isRunning = false;
                clearInterval(frameInterval);
                frameInterval = null;
                return;
            }
            
            if (frameInterval === null) {
                frameInterval = setInterval(() => {
                    if (isRunning && nes) {
                        try {
                            nes.frame();
                        } catch (e) {
                            console.error('Ошибка в кадре (интервал):', e);
                            isRunning = false;
                            clearInterval(frameInterval);
                            frameInterval = null;
                        }
                    }
                }, 1000 / 60);
            }
        }

        // Обработка загрузки файла
        document.getElementById('romFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            if (!file.name.toLowerCase().endsWith('.nes')) {
                alert('❌ Пожалуйста, выберите файл с расширением .nes');
                this.value = '';
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    if (data.length === 0) {
                        alert('❌ Файл пустой');
                        return;
                    }
                    
                    if (loadROM(data)) {
                        alert('✅ Игра загружена!');
                        document.getElementById('loadGameBtn').textContent = '🎮 Загрузить другую игру';
                    }
                } catch (error) {
                    console.error('Ошибка чтения файла:', error);
                    alert('❌ Ошибка чтения файла: ' + error.message);
                }
            };
            
            reader.onerror = function() {
                alert('❌ Ошибка чтения файла');
            };
            
            reader.readAsArrayBuffer(file);
            this.value = '';
        });

        // Кнопка загрузки
        document.getElementById('loadGameBtn').addEventListener('click', function() {
            document.getElementById('romFileInput').click();
        });

        // Сброс игры
        document.getElementById('resetGame').addEventListener('click', function() {
            if (romData && nes) {
                try {
                    nes.loadRom(romData);
                } catch (e) {
                    console.error('Ошибка сброса:', e);
                    alert('❌ Ошибка сброса игры');
                }
            }
        });

        // Пауза
        document.getElementById('pauseGame').addEventListener('click', function() {
            if (!nes) return;
            
            isRunning = !isRunning;
            if (!isRunning) {
                clearInterval(frameInterval);
                frameInterval = null;
                this.textContent = '▶️ Играть';
            } else {
                runFrame();
                this.textContent = '⏸️ Пауза';
            }
        });

        // ====================
        // 2. УПРАВЛЕНИЕ С ТЕЛЕФОНА
        // ====================
        function pressButton(button, pressed) {
            if (!nes) return;
            
            try {
                const buttonMap = {
                    'a': jsnes.Controller.BUTTON_A,
                    'b': jsnes.Controller.BUTTON_B,
                    'select': jsnes.Controller.BUTTON_SELECT,
                    'start': jsnes.Controller.BUTTON_START,
                    'up': jsnes.Controller.BUTTON_UP,
                    'down': jsnes.Controller.BUTTON_DOWN,
                    'left': jsnes.Controller.BUTTON_LEFT,
                    'right': jsnes.Controller.BUTTON_RIGHT
                };
                
                for (let i = 0; i < 2; i++) {
                    if (pressed) {
                        nes.buttonDown(i, buttonMap[button]);
                    } else {
                        nes.buttonUp(i, buttonMap[button]);
                    }
                }
            } catch (e) {
                console.error('Ошибка нажатия кнопки:', e);
            }
        }

        // ====================
        // 3. QR-КОД
        // ====================
        function generateQR() {
            const baseUrl = window.location.origin;
            const controllerUrl = baseUrl + '/controller.html';
            
            document.getElementById('urlDisplay').textContent = '📱 ' + controllerUrl;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            
            try {
                new QRCode(qrContainer, {
                    text: controllerUrl,
                    width: 200,
                    height: 200,
                    colorDark: '#333333',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (error) {
                qrContainer.innerHTML = '<p style="color: red;">Ошибка генерации QR</p>';
                console.error('QR Error:', error);
            }
        }

        // ====================
        // 4. WEBSOCKET
        // ====================
        let ws = null;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}?role=screen`;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    document.querySelector('#statusDisplay .connected').textContent = 'Подключено';
                    document.querySelector('#statusDisplay .connected').className = 'connected';
                    console.log('WebSocket подключен');
                };
                
                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        
                        switch(message.type) {
                            case 'connected':
                                console.log('Экран подключен');
                                break;
                                
                            case 'player_joined':
                                document.getElementById('playerCount').textContent = message.count;
                                break;
                                
                            case 'player_left':
                                document.getElementById('playerCount').textContent = message.count;
                                break;
                                
                            case 'controller_input':
                                const data = message.data;
                                if (data.button && data.pressed !== undefined) {
                                    pressButton(data.button, data.pressed);
                                }
                                break;
                        }
                    } catch (e) {
                        console.error('Ошибка парсинга сообщения:', e);
                    }
                };
                
                ws.onclose = () => {
                    document.querySelector('#statusDisplay .connected').textContent = 'Отключено';
                    document.querySelector('#statusDisplay .connected').className = 'disconnected';
                    console.log('WebSocket отключен');
                    
                    setTimeout(connectWebSocket, 5000);
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket ошибка:', error);
                };
            } catch (e) {
                console.error('Ошибка подключения WebSocket:', e);
                setTimeout(connectWebSocket, 5000);
            }
        }

        // ====================
        // 5. ЗАПУСК
        // ====================
        document.addEventListener('DOMContentLoaded', function() {
            // Инициализируем эмулятор
            initNES();
            
            generateQR();
            connectWebSocket();
            
            // АВТОМАТИЧЕСКАЯ ЗАГРУЗКА ИГРЫ
            // Пробуем загрузить DD.nes из корня
            const gameUrl = '/DD.nes';
            console.log('🔍 Пытаемся загрузить игру:', gameUrl);
            loadROMFromURL(gameUrl);
            
            console.log('Денди эмулятор загружен');
        });

        window.addEventListener('hashchange', generateQR);
    </script>
</body>
</html>
